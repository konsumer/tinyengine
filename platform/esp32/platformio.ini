; The tinyengine demo on an ESP32-2432S028R "Cheap Yellow Display".
;
;   cd platform/esp32
;   pio run -e cyd -t upload -t monitor
;
; The demo's screen is 160x120 because pntr allocates it as one contiguous RGBA8888 buffer,
; and 320x240 would need 307,200 bytes of DRAM that a WROOM-32 with no PSRAM cannot hand
; out in one block. pntr_app_esp32 upscales it 2x onto the panel.
;
; The maps themselves cost no RAM at all: tiny_bake.py put them in .rodata, which is memory
; mapped for reads, so pntr draws every tile straight out of flash.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter = +<*>

build_flags =
    -I ../../include
    -I ../../examples/demo
    -D PNTR_APP_ESP32
    -D PNTR_APP_ESP32_BOARD_CYD
    -D PNTR_ENABLE_DEFAULT_FONT
    -D PNTR_NO_SAVE_IMAGE
    ; Nothing is loaded at runtime, so the whole image decoder can go. That is most of the
    ; flash an application like this would otherwise spend, and all of its peak heap.
    -D PNTR_NO_LOAD_IMAGE
    -D PNTR_APP_SARGS_MAX_ARGS=1
    -D PNTR_APP_SARGS_BUF_SIZE=16
    ; 96 objects is more than any of the demo's maps needs; each one costs about 64 bytes.
    -D TINY_MAX_OBJECTS=96

build_src_flags = -Wall -Wextra

lib_deps =
    https://github.com/RobLoach/pntr/archive/refs/heads/master.zip
    https://github.com/konsumer/pntr_app/archive/refs/heads/esp32.zip
