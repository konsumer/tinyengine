name: Publish Site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v11
      - name: Build Site
        run: |
          pip3 install Pillow
          npm run gen:maps
          npm run build:web
          mkdir -p webroot
          mv build-web/examples/demo/index.html webroot/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./webroot
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4